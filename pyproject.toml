[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icpqc"                       # working name — verify availability on PyPI before release
version = "0.1.0.dev0"
description = "Post-run QC engine and audit-ready compliance reporter for ICP-MS batch exports"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Linhan Li" }]
keywords = ["ICP-MS", "QC", "quality-control", "EPA-6020", "mass-spectrometry", "laboratory"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
icpqc = "icpqc.cli:main"

[project.urls]
# Fill in after the personal-account repo exists:
# Homepage = "https://github.com/<personal-account>/icpqc"
