[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icpms-qc"
version = "0.1.0.dev0"
description = "Post-run QC engine and audit-ready compliance reporter for ICP-MS batch exports"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Linhan Li" }]
keywords = ["ICP-MS", "QC", "quality-control", "EPA-6020", "mass-spectrometry", "laboratory"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
oes = ["openpyxl>=3.1"]      # reading Agilent ICP Expert workbooks (ICP-OES)
dev = ["pytest>=8.0", "openpyxl>=3.1"]

[project.scripts]
icpms-qc = "icpms_qc.cli:main"

[project.urls]
Homepage = "https://github.com/yzoe236/icpms-qc"
Issues = "https://github.com/yzoe236/icpms-qc/issues"

[tool.setuptools.packages.find]
include = ["icpms_qc*"]

[tool.setuptools.package-data]
"icpms_qc.configs" = ["*.yaml", "*.md", "crm/*.yaml", "crm/*.md", "crm/*.yaml.example"]
