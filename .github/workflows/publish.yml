name: publish to PyPI

# Publishes when a GitHub Release is created, and on demand.
#
# There is no API token anywhere in this file, and none needs to be stored in
# the repository secrets. PyPI trusted publishing lets PyPI verify the identity
# of this workflow directly through GitHub's OpenID Connect, so the thing that
# would otherwise be worth stealing does not exist. Setting it up is one form
# on PyPI, described in docs/RELEASING.md.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/

  publish:
    name: upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for trusted publishing. Nothing else in the workflow needs it.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
