# Rule pack: EPA Method 200.8-style defaults (drinking/ambient waters).
#
# !! TYPICAL VALUES, NOT THE METHOD TEXT !!
# Every threshold below MUST be verified against the current revision of EPA
# 200.8 before any compliance use. Notable difference from the 6020B-style
# pack: the internal-standard window.
pack: epa200_8
shared:
  loq_ppb:
    default: 0.1
checks:
  cal_linearity:   { enabled: true, params: { min_r: 0.998 },                             verify: "200.8 calibration acceptance" }
  # r alone passes a curve whose bottom reads 50% low — see docs/SOURCE_BASIS.md.
  cal_back_calc:   { enabled: true, params: { window_pct: [90, 110], low_window_pct: [70, 130], min_levels: 3 }, verify: "200.8 calibration verification — each standard back-calculates; CONFIRM window vs current text" }
  cal_heteroscedasticity: { enabled: true, params: { max_ratio: 3.0, min_low_err_pct: 10.0, min_levels: 4, on_exceed: warn }, verify: "Eurachem/ICH Q2(R2) — weighted regression indicator (diagnostic, not a 200.8 criterion)" }
  cal_low_std:     { enabled: true, params: { window_pct: [70, 130] },                    verify: "200.8 low-level standard practice" }
  icv_recovery:    { enabled: true, params: { window_pct: [90, 110] },                    verify: "200.8 QCS/IPC acceptance" }
  ccv_recovery:    { enabled: true, params: { window_pct: [90, 110] },                    verify: "200.8 continuing calibration (IPC)" }
  ccv_frequency:   { enabled: true, params: { every_n: 10, end_of_run: true },            verify: "200.8 QC frequency" }
  icb_ccb_blank:   { enabled: true, params: { limit: "LOQ" },                             verify: "200.8 calibration blank acceptance" }
  method_blank:    { enabled: true, params: { limit: "LOQ" },                             verify: "200.8 laboratory reagent blank" }
  blank_derived_lod: { enabled: true, params: { blank_types: [ICB, CCB], k_lod: 3, k_loq: 10, min_n: 3, on_exceed: warn }, verify: "40 CFR 136 App. B / lab MDL-LOQ procedure" }
  # Repeatability of the replicate integrations. Accuracy checks cannot see this,
  # and a run can recover every standard perfectly while the signal refuses to sit
  # still. Gated on intensity: the %RSD of a blank is counting noise, not a finding.
  precision_rsd:   { enabled: true, params: { max_rsd_pct: 5.0, min_intensity_cps: 1000, min_conc_x_loq: 10 }, verify: "lab SOP / method precision criteria — 5% is the instrument-software default, not a method limit" }
  # The instrument already judged this run. Reported, not decisive: these are the
  # vendor's thresholds, not this pack's. `on_flag: fail` makes them binding.
  instrument_flags: { enabled: true, params: { on_flag: warn, max_rows: 60 },        verify: "instrument software QC settings — whoever configured them" }
  istd_recovery:   { enabled: true, params: { window_pct: [60, 125], reference: "ical" }, verify: "200.8 internal standards — CONFIRM window vs current text" }
  lcs_recovery:    { enabled: true, params: { window_pct: [85, 115] },                    verify: "200.8 LFB acceptance — CONFIRM" }
  crm_recovery:    { enabled: true, params: { library: crm, window_pct: [85, 115] },      verify: "certificate of analysis + lab control limits for CRMs" }
  dup_rpd:         { enabled: true, params: { max_rpd_pct: 20, min_conc_x_loq: 5 },       verify: "200.8 duplicate criteria" }
  ms_msd:          { enabled: true, params: { window_pct: [70, 130], max_rpd_pct: 20 },   verify: "200.8 LFM recovery — CONFIRM" }
  serial_dilution: { enabled: false, params: { factor: 5, agreement_pct: 10, min_conc_x_loq: 50 }, verify: "not a standard 200.8 element — enable per lab SOP" }
  # Audits the laser-vs-ICP correspondence when a laser log is supplied
  # (--laser-log). NOT_EVALUATED without one, which is the solution-mode norm.
  laser_log_alignment: { enabled: true, params: { granularity: auto, require_name_match: true, max_duration_dev_pct: 25 }, verify: "LA-ICP-MS: laser log vs reduced results — sequence/ablation granularity is workflow-specific" }
  seq_structure:   { enabled: true, params: { require: [ICV, ICB, MB, LCS] },             verify: "lab SOP / method QC section" }
